<meta name="color-scheme" content="light dark" />
<script>
  /* Aplica o tema salvo (ou o do sistema) antes da página renderizar, evitando o "flash" claro. */
  (function () {
    var dark = false;
    try {
      var saved = localStorage.getItem("theme");
      dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    } catch (e) {}
    if (dark) {
      document.documentElement.classList.add("dark");
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", "#181614");
    }
  })();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cream: "rgb(var(--c-cream) / <alpha-value>)",
          sand: "rgb(var(--c-sand) / <alpha-value>)",
          beige: "rgb(var(--c-beige) / <alpha-value>)",
          bark: "rgb(var(--c-bark) / <alpha-value>)",
          espresso: "rgb(var(--c-espresso) / <alpha-value>)",
          ochre: "rgb(var(--c-ochre) / <alpha-value>)",
          correct: "rgb(var(--c-correct) / <alpha-value>)",
          wrong: "rgb(var(--c-wrong) / <alpha-value>)",
        },
        fontFamily: {
          display: ["Fraunces", "serif"],
          body: ["Inter", "sans-serif"],
        },
        borderRadius: {
          card: "1.25rem",
        },
      },
    },
  };
</script>

<style>
  /* Paleta (tons RGB para o Tailwind aplicar opacidade). Claro = padrão. */
  :root {
    --c-cream: 244 238 225;   /* #F4EEE1 fundo */
    --c-beige: 228 217 196;   /* #E4D9C4 cards */
    --c-sand: 201 177 140;    /* #C9B18C bordas */
    --c-bark: 92 70 48;       /* #5C4630 texto secundário */
    --c-espresso: 62 47 32;   /* #3E2F20 texto principal */
    --c-ochre: 168 118 62;    /* #A8763E destaque */
    --c-correct: 91 117 83;   /* #5B7553 */
    --c-wrong: 166 73 58;     /* #A6493A */
  }
  /* Modo escuro: grafite aquecido, sem preto puro. */
  html.dark {
    color-scheme: dark;
    --c-cream: 24 22 20;      /* #181614 fundo */
    --c-beige: 36 33 30;      /* #24211E cards */
    --c-sand: 54 49 44;       /* #36312C bordas */
    --c-bark: 156 146 136;    /* #9C9288 texto secundário */
    --c-espresso: 245 241 235;/* #F5F1EB texto principal */
    --c-ochre: 201 150 92;    /* #C9965C destaque (mais claro p/ contraste) */
    --c-correct: 127 163 116;
    --c-wrong: 208 112 95;
  }
  /* O bloco de quiz é sempre uma superfície escura com texto claro. */
  html.dark .quiz-scope {
    --c-espresso: 36 33 30;
    --c-cream: 245 241 235;
    --c-sand: 201 177 140;
    --c-correct: 91 117 83;
    --c-wrong: 166 73 58;
    border: 1px solid #36312C;
  }
  html.dark .quiz-scope .text-correct { color: #8DB683; }
  html.dark .quiz-scope .text-wrong { color: #E08B7A; }
  html.dark .bg-white\/60 { background-color: #24211E; }
  html.dark .text-bark\/60, html.dark .text-bark\/70 { color: #9C9288; }
  html.dark .body-text { color: #D8D0C6; }
  /* Ilustrações: no escuro, a mesma paleta é trocada pelos tons do tema escuro. */
  html.dark .visual-wrap { background-color: #1F1C19; border-color: #36312C; }
  html.dark .visual-wrap [fill="#F4EEE1" i] { fill: #1F1C19; }
  html.dark .visual-wrap [fill="#E4D9C4" i] { fill: #2E2A25; }
  html.dark .visual-wrap [fill="#D8C9A8" i] { fill: #3A342D; }
  html.dark .visual-wrap [fill="#C9B18C" i] { fill: #5A4D3E; }
  html.dark .visual-wrap [fill="#3E2F20" i] { fill: #F5F1EB; }
  html.dark .visual-wrap [fill="#5C4630" i] { fill: #B9AD9F; }
  html.dark .visual-wrap [fill="#A8763E" i] { fill: #C9965C; }
  html.dark .visual-wrap [fill="#5B7553" i] { fill: #8DB683; }
  html.dark .visual-wrap [fill="#A6493A" i] { fill: #E08B7A; }
  html.dark .visual-wrap [stroke="#C9B18C" i] { stroke: #4A433B; }
  html.dark .visual-wrap [stroke="#5C4630" i] { stroke: #9C9288; }
  html.dark .visual-wrap [stroke="#3E2F20" i] { stroke: #CFC5B8; }
  html.dark .visual-wrap [stroke="#A8763E" i] { stroke: #C9965C; }
  html.dark .visual-wrap [stroke="#5B7553" i] { stroke: #8DB683; }
  html.dark .visual-wrap [stroke="#A6493A" i] { stroke: #E08B7A; }
  html.dark .visual-wrap p[style*="#5C4630" i] { color: #9C9288 !important; }
  /* Texto claro dentro de caixas que ficaram claras: volta a ser escuro */
  html.dark .visual-wrap [fill="#F4EEE1" i]:is(text, tspan) { fill: #1F1C19; }
  html.dark .card-hover:hover { box-shadow: 0 12px 28px -12px rgba(0, 0, 0, 0.6); }

  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; background-color: rgb(var(--c-cream)); }
  .font-display { font-family: 'Fraunces', serif; }
  ::selection { background-color: #C9B18C; color: #3E2F20; }

  /* Transição suave só durante a troca de tema */
  html.theme-anim, html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after {
    transition: background-color .3s ease, border-color .3s ease, color .3s ease, fill .3s ease !important;
  }

  .theme-toggle { transition: background-color .2s ease, border-color .2s ease, transform .2s ease; }
  .theme-toggle:hover { border-color: rgb(var(--c-ochre)); }
  .theme-toggle:active { transform: scale(0.94); }
  .theme-toggle .icon-sun { display: none; }
  html.dark .theme-toggle .icon-sun { display: block; }
  html.dark .theme-toggle .icon-moon { display: none; }

  .card-hover {
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .card-hover:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px -12px rgba(62, 47, 32, 0.28);
    border-color: #A8763E;
  }

  .quiz-option {
    transition: background-color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .quiz-option:active { transform: scale(0.98); }

  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: rgb(var(--c-cream)); }
  ::-webkit-scrollbar-thumb { background: rgb(var(--c-sand)); border-radius: 999px; }
</style>
</head>

<script>
const DB = { subjects: window.DB_SUBJECTS || [] };

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
const app = document.getElementById("app");
const breadcrumb = document.getElementById("breadcrumb");

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function findSubject(id) {
  return DB.subjects.find((s) => s.id === id);
}
function findContent(subjectId, contentId) {
  const subject = findSubject(subjectId);
  if (!subject) return null;
  return subject.contents.find((c) => c.id === contentId);
}

/* ============================================================
   ROTEADOR (baseado em hash, sem recarregar a página)
   ============================================================ */
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, "");
  const parts = raw.split("/").filter(Boolean);
  if (parts.length === 0 || parts[0] === "home") return { view: "home" };
  if (parts[0] === "materia" && parts[1]) {
    if (parts[2] === "conteudo" && parts[3]) {
      return { view: "content", subjectId: parts[1], contentId: parts[3] };
    }
    return { view: "subject", subjectId: parts[1] };
  }
  return { view: "home" };
}

function navigate(hash) {
  location.hash = hash;
}

function router() {
  const route = parseHash();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });

  if (route.view === "home") return renderHome();
  if (route.view === "subject") return renderSubjectPage(route.subjectId);
  if (route.view === "content") return renderContentPage(route.subjectId, route.contentId);
  renderHome();
}
window.addEventListener("hashchange", router);

/* ============================================================
   RENDER: HOME
   ============================================================ */
function renderHome() {
  breadcrumb.innerHTML = "";
  app.innerHTML = "";
  app.classList.add("fade-in");

  const hero = el(`
    <section class="mb-10 sm:mb-14">
      <p class="uppercase tracking-[0.2em] text-xs font-semibold text-ochre mb-3">Painel de estudos</p>
      <h1 class="font-display text-3xl sm:text-5xl leading-tight text-espresso mb-3">
        Tudo o que você precisa revisar, em um só lugar.
      </h1>
      <p class="text-bark/70 max-w-xl leading-relaxed">
        Escolha uma matéria abaixo para acessar os conteúdos e treinar com os quizzes de revisão.
      </p>
    </section>
  `);
  app.appendChild(hero);

  if (DB.subjects.length === 0) {
    app.appendChild(el(`
      <section class="rounded-card border border-dashed border-sand bg-beige/40 px-6 py-14 text-center">
        <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-sand/50 flex items-center justify-center text-2xl">📚</div>
        <h2 class="font-display text-xl text-espresso mb-2">Nenhuma matéria por aqui ainda</h2>
        <p class="text-bark/60 max-w-md mx-auto leading-relaxed text-sm">
          Assim que a primeira matéria e o primeiro conteúdo forem enviados,
          eles vão aparecer nesta tela, organizados em cartões como este.
        </p>
      </section>
    `));
    return;
  }

  const grid = el(`<section class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5"></section>`);
  DB.subjects.forEach((subject) => {
    const card = el(`
      <a href="#/materia/${subject.id}"
         class="card-hover group block rounded-card bg-white/60 border border-sand/70 p-6 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <span class="text-3xl">${subject.emoji || "📘"}</span>
          <span class="text-bark/40 group-hover:text-ochre transition-colors text-lg">→</span>
        </div>
        <h3 class="font-display text-xl text-espresso mb-1">${subject.name}</h3>
        <p class="text-sm text-bark/60">${subject.contents.length} conteúdo${subject.contents.length === 1 ? "" : "s"}</p>
      </a>
    `);
    grid.appendChild(card);
  });
  app.appendChild(grid);
}

/* ============================================================
   RENDER: PÁGINA DA MATÉRIA
   ============================================================ */
function renderSubjectPage(subjectId) {
  const subject = findSubject(subjectId);
  app.innerHTML = "";
  app.classList.add("fade-in");

  if (!subject) {
    app.appendChild(backLink());
    app.appendChild(el(`<p class="text-bark/60 mt-6">Matéria não encontrada.</p>`));
    return;
  }

  breadcrumb.innerHTML = `
    <a href="#home" class="hover:text-ochre transition-colors">Início</a>
    <span class="text-bark/30">/</span>
    <span class="text-espresso">${subject.name}</span>
  `;

  app.appendChild(backLink());

  const header = el(`
    <section class="mt-6 mb-8 sm:mb-10 flex items-center gap-4">
      <span class="text-4xl">${subject.emoji || "📘"}</span>
      <div>
        <p class="uppercase tracking-[0.2em] text-xs font-semibold text-ochre mb-1">Matéria</p>
        <h1 class="font-display text-2xl sm:text-4xl text-espresso">${subject.name}</h1>
      </div>
    </section>
  `);
  app.appendChild(header);

  if (subject.contents.length === 0) {
    app.appendChild(el(`
      <section class="rounded-card border border-dashed border-sand bg-beige/40 px-6 py-14 text-center">
        <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-sand/50 flex items-center justify-center text-2xl">📚</div>
        <h2 class="font-display text-xl text-espresso mb-2">Nenhum conteúdo por aqui ainda</h2>
        <p class="text-bark/60 max-w-md mx-auto leading-relaxed text-sm">
          Assim que o primeiro conteúdo de ${subject.name} for enviado, ele vai aparecer nesta tela.
        </p>
      </section>
    `));
    return;
  }

  const grid = el(`<section class="grid grid-cols-1 sm:grid-cols-2 gap-4"></section>`);
  subject.contents.forEach((content) => {
    const card = el(`
      <a href="#/materia/${subject.id}/conteudo/${content.id}"
         class="card-hover group block rounded-card bg-white/60 border border-sand/70 p-5 shadow-sm">
        <h3 class="font-display text-lg text-espresso mb-1">${content.title}</h3>
        <p class="text-sm text-bark/60">Ver conteúdo e treinar →</p>
      </a>
    `);
    grid.appendChild(card);
  });
  app.appendChild(grid);
}

/* ============================================================
   RENDER: PÁGINA DE CONTEÚDO + TREINO (QUIZ)
   ============================================================ */
function renderContentPage(subjectId, contentId) {
  const subject = findSubject(subjectId);
  const content = findContent(subjectId, contentId);
  app.innerHTML = "";
  app.classList.add("fade-in");

  if (!subject || !content) {
    app.appendChild(backLink());
    app.appendChild(el(`<p class="text-bark/60 mt-6">Conteúdo não encontrado.</p>`));
    return;
  }

  breadcrumb.innerHTML = `
    <a href="#home" class="hover:text-ochre transition-colors">Início</a>
    <span class="text-bark/30">/</span>
    <a href="#/materia/${subject.id}" class="hover:text-ochre transition-colors">${subject.name}</a>
    <span class="text-bark/30">/</span>
    <span class="text-espresso">${content.title}</span>
  `;

  app.appendChild(backLink(`#/materia/${subject.id}`, `Voltar para ${subject.name}`));

  const header = el(`
    <section class="mt-6 mb-8">
      <p class="uppercase tracking-[0.2em] text-xs font-semibold text-ochre mb-2">${subject.name}</p>
      <h1 class="font-display text-2xl sm:text-4xl text-espresso">${content.title}</h1>
    </section>
  `);
  app.appendChild(header);

  const sectionsWrap = el(`<article class="space-y-6 mb-14"></article>`);
  (content.sections || []).forEach((sec) => {
    const secEl = el(`
      <div class="rounded-card bg-white/60 border border-sand/70 p-6 shadow-sm">
        ${sec.heading ? `<h2 class="font-display text-lg text-espresso mb-2">${sec.heading}</h2>` : ""}
        <div class="body-text text-bark/80 leading-relaxed whitespace-pre-line text-[15px]"></div>
        ${sec.visual ? `<div class="visual-wrap mt-5 rounded-xl bg-beige/40 border border-sand/50 p-4"></div>` : ""}
      </div>
    `);
    secEl.querySelector(".body-text").textContent = sec.body || "";
    if (sec.visual) {
      secEl.querySelector(".visual-wrap").innerHTML = sec.visual;
    }
    sectionsWrap.appendChild(secEl);
  });
  app.appendChild(sectionsWrap);

  app.appendChild(renderQuizSection(content.quiz, { noShuffle: content.noShuffle }));

  if (content.extraQuiz && content.extraQuiz.length) {
    app.appendChild(
      renderQuizSection(content.extraQuiz, {
        noShuffle: content.noShuffle,
        label: content.extraQuizLabel || "Questões extras",
        heading: content.extraQuizHeading || "Mais um round de revisão",
      })
    );
  }
}

function backLink(href = "#home", label = "Voltar ao início") {
  return el(`
    <a href="${href}" class="inline-flex items-center gap-2 text-sm font-medium text-bark/70 hover:text-ochre transition-colors">
      <span aria-hidden="true">←</span> ${label}
    </a>
  `);
}

/* ============================================================
   ENGINE DO QUIZ (Treino) — 10 perguntas, 1 tentativa cada
   ============================================================ */
function shuffleArray(array) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shuffleQuestions(questions, noShuffle) {
  if (noShuffle) return questions.slice();
  return shuffleArray(questions).map((question) => {
    const order = shuffleArray(question.options.map((_, i) => i));
    return {
      q: question.q,
      options: order.map((i) => question.options[i]),
      correct: order.indexOf(question.correct),
    };
  });
}

function renderQuizSection(questions, opts = {}) {
  const originalQuestions = questions || [];
  const label = opts.label || "Treino";
  const heading = opts.heading || "Teste o que você aprendeu";
  const noShuffle = !!opts.noShuffle;

  const section = el(`
    <section class="quiz-scope rounded-card bg-espresso text-cream p-6 sm:p-8">
      <p class="uppercase tracking-[0.2em] text-xs font-semibold text-sand mb-1">${label}</p>
      <h2 class="font-display text-2xl mb-1">${heading}</h2>
      <p class="quiz-meta text-cream/60 text-sm mb-6"></p>
      <div class="quiz-list space-y-4"></div>
      <div class="quiz-score mt-8 hidden rounded-card bg-cream/10 border border-cream/20 px-5 py-4 text-center"></div>
    </section>
  `);

  const list = section.querySelector(".quiz-list");
  const scoreBox = section.querySelector(".quiz-score");
  const meta = section.querySelector(".quiz-meta");

  function startRound() {
    list.innerHTML = "";
    scoreBox.classList.add("hidden");
    scoreBox.innerHTML = "";

    if (originalQuestions.length === 0) {
      meta.textContent = "";
      list.appendChild(el(`<p class="text-cream/60 text-sm">O treino deste conteúdo ainda será adicionado.</p>`));
      return;
    }

    const questions = shuffleQuestions(originalQuestions, noShuffle);
    const orderNote = noShuffle ? "" : " · ordem embaralhada a cada tentativa";
    meta.textContent = `${questions.length} pergunta${questions.length === 1 ? "" : "s"} · uma tentativa por pergunta${orderNote}`;

    let answered = 0;
    let correctCount = 0;

    questions.forEach((question, qIndex) => {
      const qCard = el(`

        <div class="rounded-card bg-cream/5 border border-cream/15 p-5">
          <p class="font-medium mb-4 leading-snug">${qIndex + 1}. ${question.q}</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 opts"></div>
          <p class="feedback mt-3 text-sm font-medium hidden"></p>
        </div>
      `);
      const optsWrap = qCard.querySelector(".opts");
      const feedback = qCard.querySelector(".feedback");
      let locked = false;

      question.options.forEach((optionText, optIndex) => {
        const btn = el(`
          <button type="button"
            class="quiz-option text-left px-4 py-3 rounded-xl border border-cream/25 bg-transparent hover:bg-cream/10 text-sm">
            ${optionText}
          </button>
        `);
        btn.addEventListener("click", () => {
          if (locked) return;
          locked = true;
          answered++;

          const isCorrect = optIndex === question.correct;
          if (isCorrect) correctCount++;

          [...optsWrap.children].forEach((b, i) => {
            b.classList.remove("hover:bg-cream/10");
            b.disabled = true;
            if (i === question.correct) {
              b.classList.add("bg-correct/80", "border-correct", "text-cream");
            } else if (i === optIndex && !isCorrect) {
              b.classList.add("bg-wrong/80", "border-wrong", "text-cream");
            } else {
              b.classList.add("opacity-50");
            }
          });

          feedback.classList.remove("hidden");
          feedback.textContent = isCorrect
            ? "Certo! Boa."
            : `Errado. A resposta correta é: ${question.options[question.correct]}`;
          feedback.classList.add(isCorrect ? "text-correct" : "text-wrong");

          if (answered === questions.length) {
            scoreBox.classList.remove("hidden");
            scoreBox.innerHTML = `
              <p class="font-display text-xl">${correctCount} de ${questions.length} corretas</p>
              <p class="text-cream/60 text-sm mt-1">Revise o conteúdo acima nos pontos que errou.</p>
              <button type="button" class="restart-btn mt-4 inline-flex items-center gap-2 rounded-full bg-cream text-espresso text-sm font-semibold px-5 py-2.5 hover:bg-sand transition-colors">
                ↺ Recomeçar treino
              </button>
            `;
            scoreBox.querySelector(".restart-btn").addEventListener("click", startRound);
          }
        });
        optsWrap.appendChild(btn);
      });

      list.appendChild(qCard);
    });
  }

  startRound();
  return section;
}

/* Modo escuro: botão no cabeçalho, preferência salva no navegador */
(function setupTheme() {
  const root = document.documentElement;
  const btn = document.getElementById("theme-toggle");
  const meta = document.querySelector('meta[name="theme-color"]');
  const media = window.matchMedia("(prefers-color-scheme: dark)");

  function apply(dark) {
    root.classList.toggle("dark", dark);
    if (meta) meta.setAttribute("content", dark ? "#181614" : "#3E2F20");
    if (btn) {
      btn.setAttribute("aria-pressed", String(dark));
      btn.setAttribute("aria-label", dark ? "Ativar modo claro" : "Ativar modo escuro");
    }
  }
  function saved() {
    try { return localStorage.getItem("theme"); } catch (e) { return null; }
  }

  apply(root.classList.contains("dark"));

  if (btn) {
    btn.addEventListener("click", () => {
      const dark = !root.classList.contains("dark");
      root.classList.add("theme-anim");
      apply(dark);
      try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
      setTimeout(() => root.classList.remove("theme-anim"), 350);
    });
  }

  /* Sem escolha manual, acompanha o tema do sistema */
  media.addEventListener("change", (e) => { if (!saved()) apply(e.matches); });
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {
      /* instalação como PWA segue funcionando mesmo sem o service worker */
    });
  });
}
